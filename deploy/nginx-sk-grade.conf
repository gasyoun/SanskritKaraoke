# sk-grade nginx location — additive block for samskrte.ru (H6317).
# Insert INSIDE the existing `server { server_name samskrte.ru ... }` block
# in /etc/nginx/sites-enabled/samskrte.ru (the :15 one, not the www-301 one),
# BEFORE `location /` (prefix locations win over `/` regardless of order,
# but keeping it above reads cleaner). Then `nginx -t && systemctl reload nginx`.
#
# Do NOT touch the TLS/sslip/cert lines — see /etc/nginx/sites-enabled/whisper
# for the historical reason (certbot --nginx injections vs hand-written truth).
#
# H6500 edge throttle. The zone MUST be declared once in an `http { }` context
# (nginx.conf or a conf.d/*.conf fragment), NOT in this server block:
#
#     # /etc/nginx/conf.d/sk-grade-limit.conf
#     limit_req_zone $binary_remote_addr zone=sk_grade:10m rate=30r/m;
#     limit_req_status 429;
#
# 30 r/m ≈ one grading POST every 2 s per client IP; burst=6 absorbs the
# retry/backoff pattern of the student page (a Telegram WebApp retries the
# upload a few times) without letting a bot fan out. A shared/NAT school
# network still gets 6 immediate requests per IP — widen burst rather than
# the rate if a real cohort reports 429s.
#
# /healthz is an exact-match location, so nginx never applies limit_req to it
# (exact matches win over the prefix location below): the uptime probe and
# the app's own readiness check must not be throttled. The app-side cap
# (SK_GRADE_MAX_CONCURRENCY, tools/serve_grade.py) bounds the actual whisper
# jobs — nginx alone only bounds request arrival.

location = /sk-grade/healthz {
    proxy_pass http://127.0.0.1:8791/healthz;
}

location /sk-grade/ {
    # student.html is served from GitHub Pages / Telegram WebApp — cross-origin
    # POST with an audio body; the service itself answers CORS preflights.
    client_max_body_size 12m;
    # H6500: per-IP request throttle; burst allows a retry, nodelay answers
    # immediately instead of queueing (a queued 12 MB upload is worse than 429).
    limit_req zone=sk_grade burst=6 nodelay;
    proxy_pass http://127.0.0.1:8791/;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
