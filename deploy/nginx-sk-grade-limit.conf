# sk-grade edge throttle zone (H6500) — install to /etc/nginx/conf.d/.
# `limit_req_zone` is only legal in an `http { }` context, so it cannot live in
# deploy/nginx-sk-grade.conf (that file is an additive `server { }` fragment).
# The matching `limit_req zone=sk_grade burst=6 nodelay;` line is in that
# fragment. Order: copy this file first, then insert the location block,
# then `nginx -t && systemctl reload nginx`.
limit_req_zone $binary_remote_addr zone=sk_grade:10m rate=30r/m;
# 30 r/m ≈ one grading POST every 2 s per client IP. A shared/NAT school
# network gets burst=6 immediate requests per IP; widen burst (not rate) if a
# real cohort reports 429s. /sk-grade/healthz is an exact-match location and
# is never throttled (the uptime probe must not be 429'd).
limit_req_status 429;
